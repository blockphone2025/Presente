<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Presente - Pronto disponible" />
    <title>Presente</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Arial, sans-serif;
        background: #f7f3ea;
        color: #1f2933;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        text-align: center;
        background:
          radial-gradient(circle at top left, rgba(249, 115, 22, 0.16), transparent 35%),
          #f7f3ea;
      }

      main {
        max-width: 680px;
        padding: 40px 24px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(3rem, 12vw, 7rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
      }

      p {
        margin: 0;
        color: #52616b;
        font-size: clamp(1.1rem, 3vw, 1.35rem);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Presente</h1>
      <p>Pronto disponible.</p>
    </main>
  </body>
</html>
